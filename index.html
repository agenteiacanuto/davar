<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Davar</title>
<meta name="description" content="Jogo de palavras: deslize pelas letras da roda e complete a palavra cruzada.">
<meta name="theme-color" content="#fd9f7d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Davar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen app. Illustrated chapter landscape behind; top bar, crossword in the middle, letter wheel at the bottom. */
:root{
  --sky1:#ffd3a5; --sky2:#fd9f7d; --accent:#e2683c; --accent-ink:#8a3415;
  --ink:#3a2418; --ink-soft:rgba(58,36,24,.7);
  --tile:#fffaf4; --tile-edge:rgba(58,36,24,.16); --panel:rgba(255,250,244,.9);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sky2)}
body{height:100%;margin:0;font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:linear-gradient(var(--sky1),var(--sky2))}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* Buttons and pills */
.btn{appearance:none;border:0;border-radius:18px;background:var(--accent);color:#fff;font:600 24px var(--display);
  padding:12px 30px 13px;box-shadow:0 5px 0 var(--accent-ink),0 10px 20px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-ink),0 4px 10px rgba(0,0,0,.15)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.12)}
.round{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;
  box-shadow:0 3px 0 rgba(0,0,0,.12);font:700 20px var(--display)}
.round svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 12px 6px 6px;
  font:700 17px var(--display);box-shadow:0 3px 0 rgba(0,0,0,.1);font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c343 55%,#c98a12);
  box-shadow:inset 0 0 0 2px rgba(150,95,10,.5);display:inline-block}

/* Home */
.home{justify-content:center;align-items:center;text-align:center;gap:18px;overflow-y:auto}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px}
.logo .heb{font:400 22px "Times New Roman",serif;color:var(--ink-soft);direction:rtl}
.logo h1{margin:0;font:700 clamp(44px,14vw,80px)/.95 var(--display);color:var(--ink);white-space:nowrap}
.logo h1 span{display:inline-block;background:var(--tile);border-radius:16px;padding:0 .08em;margin:0 .03em;
  box-shadow:0 5px 0 var(--tile-edge);color:var(--accent)}
.logo p{margin:8px 0 0;max-width:28ch;color:var(--ink-soft);font-size:16px;line-height:1.4}
.chapters{width:100%;max-width:380px;display:grid;gap:8px}
.chap{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:8px 14px 8px 8px;
  text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.chap .sw{width:42px;height:42px;border-radius:12px}
.chap b{display:block;font:600 18px var(--display)}
.chap small{color:var(--ink-soft);font-size:13px}
.chap .prog{font:700 15px var(--display);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.chap.locked{opacity:.55}
.chap.current{outline:3px solid var(--accent)}
.home-foot{display:flex;gap:10px;align-items:center}

/* Game */
.topbar{display:flex;align-items:center;gap:10px}
.lvl{flex:1;text-align:center;min-width:0}
.lvl b{display:block;font:700 22px/1.05 var(--display)}
.lvl small{font-size:13px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.grid-wrap{flex:1;min-height:0;display:grid;place-items:center;padding-block:10px 4px}
#grid{position:relative}
.cell{position:absolute;border-radius:22%;background:var(--tile);box-shadow:0 3px 0 var(--tile-edge);display:grid;place-items:center;
  font:700 1em var(--display);color:var(--ink);transition:background .25s}
.cell span{opacity:0;transform:scale(.3);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.cell.on span{opacity:1;transform:none}
.cell.flash{animation:flash .6s}
.cell.hint span{color:var(--accent)}
@keyframes flash{0%,100%{background:var(--tile)}35%{background:var(--accent)}}
.preview{height:46px;display:flex;justify-content:center;align-items:center}
.preview .word{display:flex;gap:3px;background:var(--accent);border-radius:12px;padding:4px 10px;color:#fff;font:700 26px var(--display);
  letter-spacing:.06em;box-shadow:0 4px 0 var(--accent-ink);min-width:20px}
.preview .word:empty{display:none}
.preview .word.bad{animation:shake .35s;background:#b9b1a9;box-shadow:0 4px 0 #7d746b}
.preview .word.ok{animation:pop .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes pop{50%{transform:scale(1.15)}}
.dock{position:relative;display:grid;grid-template-columns:52px 1fr 52px;align-items:end;gap:6px;padding-bottom:6px}
.side{display:flex;flex-direction:column;gap:10px;align-items:center}
.side .round{position:relative}
.badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;
  font:700 12px/22px var(--display);padding:0 5px;text-align:center}
.badge.cost{background:#f6c343;color:#5a3a06}
#wheel{position:relative;justify-self:center;width:min(280px,calc(100vw - 32px - 124px));aspect-ratio:1;border-radius:50%;background:var(--panel);
  box-shadow:0 6px 0 rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.12);touch-action:none}
#wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.letter{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
  font:700 clamp(26px,8vw,36px) var(--display);color:var(--ink);transition:background .12s,color .12s,transform .12s;pointer-events:none}
.letter.sel{background:var(--accent);color:#fff;transform:translate(-50%,-50%) scale(1.06)}
.toast{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;
  font:700 15px var(--body);white-space:nowrap;opacity:0;pointer-events:none}
.toast.show{animation:toast 1.4s ease}
@keyframes toast{10%,75%{opacity:1;transform:translate(-50%,-110%)}100%{opacity:0;transform:translate(-50%,-140%)}}

/* Panels */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(30,20,14,.45);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.panel{width:100%;max-width:360px;max-height:100%;overflow-y:auto;text-align:center;background:var(--tile);border-radius:24px;padding:24px 20px 20px;
  box-shadow:0 8px 0 var(--tile-edge),0 24px 50px rgba(0,0,0,.3);animation:pin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pin{from{transform:scale(.85);opacity:0}}
.panel h2{font:700 34px/1.05 var(--display);margin:0 0 6px;color:var(--ink)}
.panel p{margin:0 0 12px;color:var(--ink-soft);line-height:1.4}
.panel .actions{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.star{width:48px;height:48px;background:#e3d9cf;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:#f6c343;animation:starIn .45s cubic-bezier(.3,1.6,.5,1) both}
.star:nth-child(2){transform:translateY(-8px)}
.star.on:nth-child(2){animation-delay:.2s}.star.on:nth-child(3){animation-delay:.4s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}}
.reward{display:inline-flex;align-items:center;gap:8px;font:700 22px var(--display);margin-bottom:6px}
.bonus-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}
.bonus-list span{background:#f3ebe3;border-radius:8px;padding:3px 8px;font:600 15px var(--display)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f3ebe3;border-radius:14px;padding:12px 14px;font-weight:800;margin-bottom:8px;cursor:pointer}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog i{width:46px;height:26px;border-radius:13px;background:#cfc4b9;position:relative;flex:none}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tog input:checked + i{background:var(--accent)}
.tog input:checked + i::after{transform:translateX(20px)}
.tog input:focus-visible + i{outline:3px solid var(--accent);outline-offset:2px}

/* Categorias e palavra-tema */
.packs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:380px}
.packs button{border:0;border-radius:999px;padding:8px 14px;background:var(--panel);font:600 15px var(--display);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.packs button[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-ink)}
.theme-chip{align-self:center;margin-top:8px;display:inline-flex;align-items:center;gap:8px;background:#fff3c4;color:#6b4a06;border-radius:999px;
  padding:5px 12px 5px 6px;font:600 15px var(--display);box-shadow:0 3px 0 rgba(150,100,10,.25)}
.theme-chip i{width:18px;height:18px;border-radius:5px;background:#f6c343;box-shadow:inset 0 0 0 2px #d9a12a}
.cell.theme{background:#fff3c4;box-shadow:0 3px 0 rgba(160,110,10,.4),inset 0 0 0 2px #f2c14e}
.cell.theme.on{background:#f6c343;color:#4a2f04}

/* Dark chapters */
body.dark{--ink:#f4efff;--ink-soft:rgba(244,239,255,.72);--tile:#fbf8ff;--tile-edge:rgba(0,0,0,.35);--panel:rgba(255,255,255,.14)}
body.dark .cell,body.dark .letter,body.dark .panel,body.dark .panel h2{color:#2a2140}
body.dark .panel p{color:rgba(42,33,64,.72)}
body.dark #wheel{background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
body.dark .letter{color:#f4efff}
body.dark .letter.sel{color:#fff}
body.dark .btn.ghost{background:#f3ebe3;color:#2a2140}
body.dark .tog,body.dark .bonus-list span{background:#eee8f7;color:#2a2140}
body.dark .packs button{color:#f4efff}
body.dark .packs button[aria-selected="true"]{color:#fff}
body.dark .toast{background:#fff;color:#2a2140}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div id="app">
  <section id="home" class="screen home">
    <div class="logo">
      <span class="heb" aria-hidden="true">דָּבָר</span>
      <h1 aria-label="Davar"><span>D</span><span>A</span><span>V</span><span>A</span><span>R</span></h1>
      <p>Deslize pelas letras da roda e complete a palavra cruzada.</p>
    </div>
    <div class="packs" id="packs" role="tablist" aria-label="Categoria"></div>
    <button class="btn" id="btnPlay">Jogar</button>
    <div class="chapters" id="chapters"></div>
    <div class="home-foot">
      <span class="pill"><i class="coin"></i><span id="homeCoins">100</span></span>
      <button class="round" id="btnOpts" aria-label="Opções"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="topbar">
      <button class="round" id="btnHome" aria-label="Início"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="lvl"><small id="chapName">Amanhecer</small><b id="lvlName">Fase 1</b></div>
      <span class="pill"><i class="coin"></i><span id="coins">100</span></span>
    </div>
    <div class="theme-chip" id="themeChip" hidden></div>
    <div class="grid-wrap" id="gridWrap"><div id="grid" aria-label="Palavra cruzada"></div></div>
    <div class="preview" aria-live="polite"><div class="word" id="preview"></div></div>
    <div class="dock">
      <div class="side">
        <button class="round" id="btnBonus" aria-label="Palavras bônus"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span class="badge" id="bonusCount">0</span></button>
        <button class="round" id="btnShuffle" aria-label="Embaralhar letras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      </div>
      <div id="wheel" aria-label="Roda de letras"><svg id="wheelLine"></svg></div>
      <div class="side">
        <button class="round" id="btnHint" aria-label="Dica: revelar uma letra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span class="badge cost">25</span></button>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </section>
</div>
<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<script>
(() => {
'use strict';

} catch (e) {}

setPack(prog.pack);

const Snd = {

  good() { [659, 784, 1047].forEach((f, i) => this.tone(f, .3, { type: 'triangle', v: .12, delay: i * .07 })); },

/* ===== Estado da fase ===== */
let L = null, cells = new Map(), found = new Set(), bonusFound = new Set(), revealed = new Set(), hintsUsed = 0, letters = [];

/* ===== Grade ===== */

  L.words.forEach(w => wordCells(w).forEach((k, i) => {
    if (!cells.has(k)) { const [r, c] = k.split(',').map(Number); const el = document.createElement('div'); el.className = 'cell';
      el.innerHTML = `<span>${w[0][i]}</span>`; el.dataset.r = r; el.dataset.c = c; g.appendChild(el); cells.set(k, el); }

}
new ResizeObserver(() => { layoutGrid(); placeLetters(); }).observe($('#gridWrap'));

/* ===== Roda ===== */
const wheel = $('#wheel'), line = $('#wheelLine');

/* ===== Regras ===== */
let busy = false;
const pv = $('#preview');
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function feedback(cls, clear = 650) { pv.className = 'word ' + cls; setTimeout(() => { pv.textContent = ''; pv.className = 'word'; }, clear); }
async function submit(w) {
  if (w.length < 3) { pv.textContent = ''; return; }
  const entry = L.words.find(x => x[0] === w);
  if (entry) {
    if (found.has(w)) { toast('Essa você já achou'); wordCells(entry).forEach(k => { const el = cells.get(k); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }); feedback(''); return; }
    found.add(w); Snd.good(); feedback('ok');
    const ks = wordCells(entry);
    for (let i = 0; i < ks.length; i++) { const el = cells.get(ks[i]); el.classList.add('on', 'flash'); if (!reduceMotion) await sleep(70); }
    persist(); updateHUD(); checkComplete(); return;
  }
  if (L.bonus.includes(w)) {
    if (bonusFound.has(w)) { toast('Bônus já encontrado'); feedback(''); return; }
    bonusFound.add(w); prog.coins += BONUS_COINS; Snd.coin(); toast(`Palavra bônus! +${BONUS_COINS}`); feedback('ok');
    persist(); updateHUD(); return;
  }
  Snd.bad(); feedback('bad', 450);
}
function checkWordsByCells() {
  // palavras completadas só com dicas também contam
  L.words.forEach(w => { if (!found.has(w[0]) && wordCells(w).every(k => cells.get(k).classList.contains('on'))) found.add(w[0]); });
}
function checkComplete() {

  if (found.size < L.words.length) return;
  busy = true;
  setTimeout(levelDone, reduceMotion ? 100 : 700);
}
function updateHUD() {
  $('#coins').textContent = prog.coins; $('#homeCoins').textContent = prog.coins;
  $('#bonusCount').textContent = bonusFound.size;
  $('#bonusCount').hidden = bonusFound.size === 0;
}
function hint() {
  if (busy) return;
  if (prog.coins < HINT_COST) { toast(`Você precisa de ${HINT_COST} moedas`); Snd.bad(); return; }
  // palavra pendente com menos letras abertas
  const pending = L.words.filter(w => !found.has(w[0]));
  if (!pending.length) return;
  pending.sort((a, b) => wordCells(a).filter(k => !cells.get(k).classList.contains('on')).length - wordCells(b).filter(k => !cells.get(k).classList.contains('on')).length);
  const target = pending.find(w => wordCells(w).some(k => !cells.get(k).classList.contains('on')));
  const k = wordCells(target).find(k => !cells.get(k).classList.contains('on'));

  const first = pp.level === idx;
  if (first) { pp.level = Math.min(LEVELS.length, idx + 1); prog.coins += LEVEL_COINS; }
  pp.cur = null; save(); updateHUD(); Snd.win();
  const last = idx === LEVELS.length - 1, chapterEnd = (idx + 1) % 10 === 0;
  const extra = L.bonus.filter(w => !bonusFound.has(w)).length;
  const tw = L.words.filter(w => w[4]).map(w => w[0]);
  showPanel(`<h2>${last ? 'Categoria completa!' : chapterEnd ? 'Capítulo completo!' : 'Muito bem!'}</h2>
    ${tw.length ? `<p>${PACKS[packId].themeLabel}: <b>${tw.join(', ')}</b></p>` : ''}
    <div class="stars">${[0, 1, 2].map(i => `<i class="star${i < stars ? ' on' : ''}"></i>`).join('')}</div>
    ${first ? `<div class="reward"><i class="coin"></i>+${LEVEL_COINS}</div>` : ''}
    <p>${bonusFound.size ? `Você achou ${bonusFound.size} palavra${bonusFound.size > 1 ? 's' : ''} bônus.` : ''} ${extra ? `Ainda havia ${extra} palavra${extra > 1 ? 's' : ''} bônus escondida${extra > 1 ? 's' : ''}.` : ''}</p>
    ${chapterEnd && !last ? `<p>Próximo capítulo: <b>${chapterOf(idx + 1).name}</b></p>` : ''}`,
    last ? [{ label: 'Início', fn: () => { hidePanel(); goHome(); } }]
      : [{ label: 'Próxima fase', fn: () => { hidePanel(); busy = false; startLevel(idx + 1); } },
         { label: 'Início', ghost: true, fn: () => { hidePanel(); busy = false; goHome(); } }]);
}

/* ===== Telas ===== */
function show(id) { ['home', 'game'].forEach(s => $('#' + s).hidden = s !== id); }
function showPanel(html, btns) {
  const p = $('#panel'); p.innerHTML = html + '<div class="actions"></div>';
  const a = p.querySelector('.actions');
  btns.forEach(b => { const el = document.createElement('button'); el.className = 'btn' + (b.ghost ? ' ghost' : ''); el.textContent = b.label;
    el.addEventListener('click', () => { Snd.init(); b.fn(); }); a.appendChild(el); });
  $('#overlay').hidden = false; const f = a.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function hidePanel() { $('#overlay').hidden = true; }
function goHome() {
  const lv = Math.min(PP().level, LEVELS.length - 1);
  applyChapter(sceneOf(lv)); show('home'); renderPacks(); renderChapters(); updateHUD();
  $('#btnPlay').textContent = PP().level >= LEVELS.length ? 'Jogar de novo' : PP().level === 0 ? 'Jogar' : `Continuar · Fase ${PP().level + 1}`;
}
function renderPacks() {
  $('#packs').innerHTML = PACK_IDS.map(id => `<button role="tab" aria-selected="${id === packId}" data-id="${id}">${PACKS[id].name}</button>`).join('');
  $('#packs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { Snd.init(); Snd.tick(); setPack(b.dataset.id); save(); goHome(); }));
}
function renderChapters() {
  const P = PACKS[packId], lvl = PP().level, n = Math.ceil(LEVELS.length / 10);
  $('#chapters').innerHTML = Array.from({ length: n }, (_, i) => {
    const c = CHAPTERS[P.scenes[i]], total = Math.min(10, LEVELS.length - i * 10);
    const done = Math.max(0, Math.min(total, lvl - i * 10));
    const locked = lvl < i * 10, current = !locked && done < total;
    return `<button class="chap${locked ? ' locked' : ''}${current ? ' current' : ''}" data-i="${i}" ${locked ? 'disabled' : ''}>
      <span class="sw" style="background:linear-gradient(${c.sky[0]},${c.sky[1]})"></span>
      <span><b>${c.name}</b><small>Fases ${i * 10 + 1} a ${i * 10 + total}</small></span>
      <span class="prog">${locked ? 'bloqueado' : done + '/' + total}</span></button>`;
  }).join('');
  $('#chapters').querySelectorAll('.chap:not(.locked)').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i; Snd.init();
    const inThis = PP().level >= i * 10 && PP().level < i * 10 + 10;
    startLevel(inThis ? PP().level : i * 10);
  }));
}
function openOptions() {
  showPanel(`<h2>Opções</h2><label class="tog" for="optSound"><span>Som</span><input type="checkbox" id="optSound" ${prog.sound ? 'checked' : ''}><i></i></label>`,
    [{ label: 'Salvar', fn: () => { prog.sound = $('#optSound').checked; save(); hidePanel(); } }]);
}
function openBonus() {
  showPanel(`<h2>Palavras bônus</h2><p>Palavras que existem, mas não estão na cruzada. Cada uma vale ${BONUS_COINS} moedas.</p>
    ${bonusFound.size ? `<div class="bonus-list">${[...bonusFound].map(w => `<span>${w}</span>`).join('')}</div>` : '<p>Nenhuma ainda nesta fase.</p>'}
    <p>Faltam ${L.bonus.length - bonusFound.size} nesta fase.</p>`, [{ label: 'Fechar', ghost: true, fn: hidePanel }]);
}

$('#btnPlay').addEventListener('click', () => { Snd.init(); startLevel(PP().level >= LEVELS.length ? 0 : PP().level); });
$('#btnHome').addEventListener('click', goHome);
$('#btnHint').addEventListener('click', hint);
$('#btnShuffle').addEventListener('click', shuffle);
$('#btnBonus').addEventListener('click', openBonus);
$('#btnOpts').addEventListener('click', openOptions);
document.addEventListener('visibilitychange', () => { if (Snd.ctx) document.hidden ? Snd.ctx.suspend() : Snd.ctx.resume(); });
goHome();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
window.__davar = { startLevel, submit: w => submit(w), get L() { return L; } };
})();
</script>
</body>
